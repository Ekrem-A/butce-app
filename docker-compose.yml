services:
  # Production - Web build served with Nginx
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: butce-app:latest
    container_name: butce-app-web
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Development - Expo dev server
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: butce-app:dev
    container_name: butce-app-dev
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=0.0.0.0
    stdin_open: true
    tty: true
